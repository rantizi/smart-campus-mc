name: Android checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Runner ubuntu-latest sudah membawa Android SDK di $ANDROID_HOME; action setup-android
      # hanya dipakai bila SDK bawaan tidak ada.
      - name: Check preinstalled Android SDK
        id: sdk
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sdk.outputs.found != 'true'
        uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install baseline SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          command -v "$SDKMANAGER" >/dev/null || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check architecture
        run: python3 scripts/verify_architecture.py
      # Opsional: secret GOOGLE_SERVICES_JSON (isi file google-services.json) membuat APK CI
      # memakai Firebase. Tanpa secret, APK tetap ter-build dalam mode lokal (docs/FIREBASE.md).
      - name: Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config dipasang dari secret"
          else
            echo "Secret GOOGLE_SERVICES_JSON tidak ada; build mode lokal"
          fi
      - name: Build, unit tests, lint and test APK
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --console=plain
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padukampus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
